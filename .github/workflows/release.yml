name: Release

on:
  push:
    tags:
      - "v*"
  # Allows a manual, tag-free run of build + smoke test (e.g. to validate the
  # Windows worker-path fix in src/parser/pool.ts on real windows-x64/arm64
  # runners) without burning a version tag. Release-creation and publish
  # steps below are gated on `github.ref` actually being a tag, so a
  # workflow_dispatch run exercises build+smoke only and skips those.
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Gate for everything below. ci.yml runs on push to main, but nothing tied
  # that to the tag: a tag can point at a commit CI never saw, or be pushed
  # before CI finishes, and `create-release` publishes a NON-draft GitHub
  # Release as its very first action — visible to users before a single test
  # has run. Re-running the same checks against the tagged tree is ~2 minutes
  # on a release that already spends ~25 in the build matrix.
  #
  # Deliberately identical to ci.yml's `test` job (bun 1.3.14, frozen
  # lockfile, typecheck, tests) so a release can never be gated by a check
  # that main is not already held to.
  verify:
    name: Typecheck + tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun test

  create-release:
    name: Create GitHub Release
    # Nothing reaches the public until the tagged tree passes. `build`,
    # `package-managers` and `publish-npm` all descend from this job, so
    # gating here gates the whole pipeline.
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      upload_url: ${{ steps.create.outputs.upload_url }}
    steps:
      - uses: actions/checkout@v5

      - name: Create release
        id: create
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          draft: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: Build ${{ matrix.target }}
    # `id-token: write` lets `npm publish` authenticate to the registry over
    # OIDC (npm trusted publishing) instead of a long-lived publish token. npm
    # is retiring granular tokens that bypass 2FA: they lost account management
    # in Aug 2026 and lose direct publishing around Jan 2027, and the
    # bypass-2FA checkbox can no longer be enabled on a new token — so a
    # 2FA-required account has no working token path left. The trusted
    # publisher is configured per package on npmjs.com and names this file.
    # https://github.blog/changelog/2026-07-08-npm-install-time-security-and-gat-bypass2fa-deprecation/
    permissions:
      contents: write
      id-token: write
    needs: create-release
    runs-on: ${{ matrix.os }}
    # Without this the GitHub default applies — 360 minutes. The smoke test runs
    # three selftest subprocesses with no timeout of their own, and the --pool
    # gate spawns a worker pool; a worker that never comes up leaves the parent
    # waiting. One hung runner then blocks the root publish for six hours.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: darwin-arm64
            bun_target: bun-darwin-arm64
            node_os: darwin
            node_cpu: arm64
            ext: ""
          - os: ubuntu-latest
            target: linux-x64
            bun_target: bun-linux-x64
            node_os: linux
            node_cpu: x64
            ext: ""
          - os: ubuntu-24.04-arm
            target: linux-arm64
            bun_target: bun-linux-arm64
            node_os: linux
            node_cpu: arm64
            ext: ""
          - os: windows-latest
            target: windows-x64
            bun_target: bun-windows-x64
            node_os: win32
            node_cpu: x64
            ext: ".exe"
          - os: windows-11-arm
            target: windows-arm64
            bun_target: bun-windows-arm64
            node_os: win32
            node_cpu: arm64
            ext: ".exe"

    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        with:
          # Pinned (not `latest`) to match the Bun version the multi-entrypoint
          # `--compile` worker-bundling fix (see src/parser/pool.ts) was
          # actually verified against — this project's bun.lock also pins
          # bun-types/@types/bun to 1.3.14. `--compile`'s entrypoint-flattening
          # behavior this fix relies on is an undocumented implementation
          # detail, so silent version drift here is a real regression risk.
          bun-version: "1.3.14"

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm >= 11.5.1. Node 24 normally ships a
      # new enough npm, but the runner image decides that, not us — assert it
      # rather than discover it as a publish failure.
      - name: Ensure npm supports OIDC trusted publishing
        shell: bash
        run: |
          have="$(npm --version)"
          if node -e 'const a=process.argv[1].split(".").map(Number),b=[11,5,1];process.exit((a[0]>b[0]||(a[0]===b[0]&&(a[1]>b[1]||(a[1]===b[1]&&a[2]>=b[2]))))?0:1)' "$have"; then
            echo "npm $have is new enough for OIDC trusted publishing"
          else
            echo "npm $have is older than 11.5.1 - upgrading"
            npm install -g npm@11
          fi
          npm --version

      - name: Install dependencies
        run: bun install

      - name: Build binary
        # worker.ts is passed as a SECOND entrypoint so `--compile` bundles the
        # worker-pool parser's FULL module graph (wasm.ts, extract.ts,
        # languages.ts) AND its nested `{ type: "file" }` WASM assets into the
        # binary. Without it the pool path (src/parser/pool.ts) spawns workers
        # that cannot resolve their own imports, silently yielding zero symbols.
        run: bun build ./src/cli.ts ./src/parser/worker.ts --compile --target=${{ matrix.bun_target }} --outfile dist/project-brain-${{ matrix.target }}

      - name: Report binary size
        # Informational only, never fails the build: the pdf/docx/xlsx
        # extraction libraries (unpdf/mammoth/exceljs) added as default
        # dependencies grow every platform artifact — this makes that growth
        # visible in the job summary without gating on any threshold.
        shell: bash
        continue-on-error: true
        run: |
          set +e
          BIN="dist/project-brain-${{ matrix.target }}${{ matrix.ext }}"
          {
            echo "### Binary size — ${{ matrix.target }}"
            echo '```'
            du -h "$BIN" 2>/dev/null || echo "(could not stat $BIN)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Smoke test native binary
        shell: bash
        # Runs the JUST-BUILT native binary (matrix.os matches matrix.target, so
        # it executes natively) through the hidden `__parse-selftest` hook. That
        # hook initialises the embedded tree-sitter core + a grammar (baked into
        # the `bun build --compile` artifact), parses one .ts file, and prints
        # `STRUCT_OK <count>` — WITHOUT Ollama, the vector store, or SQLite.
        #
        # POSITIVE assertion is the primary gate: graceful degradation means a
        # broken embedded WASM asset no longer crashes `init` (it silently yields
        # zero symbols), so a negative-marker grep alone can pass vacuously. By
        # requiring STRUCT_OK with a count >= 1 we prove the structural layer is
        # actually alive in this platform binary. The narrowed negative grep
        # ($bunfs / RuntimeError) stays as defense-in-depth.
        run: |
          set -u
          BIN="dist/project-brain-${{ matrix.target }}${{ matrix.ext }}"
          chmod +x "$BIN" || true
          SMOKE="$(mktemp -d)"
          printf 'export function smoke(a, b){ return a + b; }\n' > "$SMOKE/a.ts"
          set +e
          OUT="$("$BIN" __parse-selftest "$SMOKE/a.ts" 2>&1)"
          STATUS=$?
          set -e
          echo "exit=$STATUS"
          echo "$OUT"
          # Defense-in-depth: an embedded-asset regression marker is a hard fail.
          # DIAG: lines are excluded — the selftest's own diagnostics print the
          # raw import.meta.url, which legitimately contains $bunfs on POSIX.
          if echo "$OUT" | grep -v '^DIAG:' | grep -E 'RuntimeError|\$bunfs' >/dev/null; then
            echo "::error::native binary smoke hit an embedded-asset regression (RuntimeError/\$bunfs)"
            exit 1
          fi
          # PRIMARY gate: structural layer must have produced symbols.
          if ! echo "$OUT" | grep -Eq 'STRUCT_OK [1-9][0-9]*'; then
            echo "::error::native binary smoke did NOT emit STRUCT_OK with a nonzero symbol count — structural layer is dead in this binary"
            exit 1
          fi
          rm -rf "$SMOKE"

          # POOL gate: exercise the worker-pool path (src/parser/pool.ts). The
          # sequential check above cannot detect a broken worker entrypoint —
          # this proves the second `--compile` entrypoint (worker.ts) loads its
          # full graph + embedded WASM and extracts symbols inside the binary.
          set +e
          POUT="$("$BIN" __parse-selftest --pool 2>&1)"
          PSTATUS=$?
          set -e
          echo "pool_exit=$PSTATUS"
          echo "$POUT"
          # DIAG: lines excluded here too — pool diagnostics always print the
          # raw import.meta.url ($bunfs is expected content on POSIX).
          if echo "$POUT" | grep -v '^DIAG:' | grep -E 'RuntimeError|\$bunfs' >/dev/null; then
            echo "::error::worker-pool smoke hit an embedded-asset regression (RuntimeError/\$bunfs)"
            exit 1
          fi
          if ! echo "$POUT" | grep -Eq 'STRUCT_OK [1-9][0-9]*'; then
            echo "::error::worker-pool smoke did NOT emit STRUCT_OK — the pool path is dead in this binary"
            exit 1
          fi

          # EXTRACT gate: exercise the hidden `__extract-selftest` hook. Proves
          # unpdf/mammoth/exceljs (default dependencies added for pdf/docx/xlsx
          # ingestion) actually bundle and run inside the `--compile` binary —
          # not just in dev mode. exceljs's own write path is exercised here
          # too, the biggest at-risk item for this change (see extract-selftest.ts).
          set +e
          EOUT="$("$BIN" __extract-selftest 2>&1)"
          ESTATUS=$?
          set -e
          echo "extract_exit=$ESTATUS"
          echo "$EOUT"
          if echo "$EOUT" | grep -E 'RuntimeError|\$bunfs' >/dev/null; then
            echo "::error::extract-selftest smoke hit an embedded-asset regression (RuntimeError/\$bunfs)"
            exit 1
          fi
          if ! echo "$EOUT" | grep -Eq 'EXTRACT_OK 3'; then
            echo "::error::native binary smoke did NOT emit EXTRACT_OK 3 — document extraction (pdf/docx/xlsx) is dead in this binary"
            exit 1
          fi

      - name: Upload binary to release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          files: dist/project-brain-${{ matrix.target }}*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish platform package
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"   # strip leading 'v' (v0.3.7 → 0.3.7)
          mkdir -p platform-pkg/bin
          cp "dist/project-brain-${{ matrix.target }}${{ matrix.ext }}" "platform-pkg/bin/project-brain-native${{ matrix.ext }}"
          chmod +x "platform-pkg/bin/project-brain-native${{ matrix.ext }}" || true
          node -e "
            const fs = require('fs');
            const pkg = {
              name: 'project-brain-${{ matrix.target }}',
              version: process.env.VERSION,
              description: '${{ matrix.target }} binary for project-brain',
              os: ['${{ matrix.node_os }}'],
              cpu: ['${{ matrix.node_cpu }}'],
              license: 'MIT',
              files: ['bin']
            };
            fs.writeFileSync('platform-pkg/package.json', JSON.stringify(pkg, null, 2));
          "
          cd platform-pkg
          if npm view "project-brain-${{ matrix.target }}@${VERSION}" version 2>/dev/null; then
            echo "project-brain-${{ matrix.target }}@${VERSION} already published, skipping."
          else
            npm publish --access public
          fi
        env:
          VERSION: ${{ github.ref_name }}

  package-managers:
    name: Package for Homebrew and Scoop
    needs: build
    # `always()` for the same reason publish-npm uses it: a hung platform must not
    # withhold the channels whose binaries did upload. Missing assets fail this
    # job loudly rather than emitting a formula with a blank checksum.
    #
    # `!= 'skipped'` distinguishes "some platforms failed" from "the test gate
    # failed, so nothing was built at all". always() alone treats them the same
    # and this job then fails on every missing asset, which is noise, not signal.
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Generate formula and manifest
        shell: bash
        run: bun scripts/gen-packages.ts "${{ github.ref_name }}" --out dist/packages

      # Always attached to the release, whether or not the tap push below runs:
      # the release asset is the fallback install path and the record of what
      # was generated for this tag.
      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/packages/project-brain.rb
            dist/packages/project-brain.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pushes the formula to jcsoftdev/homebrew-tap so `brew upgrade` sees the
      # new version. Needs a cross-repo token: GITHUB_TOKEN is scoped to this
      # repository only. Create a fine-grained PAT with Contents: read+write on
      # jcsoftdev/homebrew-tap and store it as the TAP_GITHUB_TOKEN secret.
      #
      # Skipped, not failed, when the secret is absent — a missing tap token must
      # not withhold a release from the channels that do not need it. The release
      # asset above still carries the formula for a manual copy. The guard lives
      # in the script, not in `if:`, because the `secrets` context is not
      # available to a step-level conditional.
      - name: Push formula to Homebrew tap
        shell: bash
        env:
          TAP_GITHUB_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ -z "${TAP_GITHUB_TOKEN:-}" ]; then
            echo "TAP_GITHUB_TOKEN is not set; skipping tap push."
            echo "The formula is attached to the release — copy it to jcsoftdev/homebrew-tap by hand."
            exit 0
          fi
          git clone --depth 1 \
            "https://x-access-token:${TAP_GITHUB_TOKEN}@github.com/jcsoftdev/homebrew-tap.git" tap
          mkdir -p tap/Formula
          cp dist/packages/project-brain.rb tap/Formula/project-brain.rb
          cd tap
          # No commit when the formula is byte-identical — re-running a release
          # workflow must not produce empty commits.
          if git diff --quiet -- Formula/project-brain.rb; then
            echo "formula unchanged for ${VERSION}; nothing to push"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/project-brain.rb
          git commit -m "project-brain ${VERSION}"
          git push origin HEAD:main

  publish-npm:
    name: Publish to npm
    permissions:
      contents: read
      id-token: write
    needs: build
    # `always()` so a single failed or hung platform build does not withhold the
    # release from every platform that DID build. The safety property is kept by
    # the dist-tag below, not by refusing to publish: a partial release goes out
    # under `next`, never `latest`.
    #
    # But `build` being *skipped* means the test gate failed and there are no
    # binaries at all. Publishing then burns a version number on a package whose
    # optionalDependencies point at platform packages that were never published —
    # installable, and broken. npm versions are immutable, so each such run costs
    # a real version. Publish only when a build actually ran.
    if: always() && startsWith(github.ref, 'refs/tags/') && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # OIDC trusted publishing needs npm >= 11.5.1. Node 24 normally ships a
      # new enough npm, but the runner image decides that, not us — assert it
      # rather than discover it as a publish failure.
      - name: Ensure npm supports OIDC trusted publishing
        shell: bash
        run: |
          have="$(npm --version)"
          if node -e 'const a=process.argv[1].split(".").map(Number),b=[11,5,1];process.exit((a[0]>b[0]||(a[0]===b[0]&&(a[1]>b[1]||(a[1]===b[1]&&a[2]>=b[2]))))?0:1)' "$have"; then
            echo "npm $have is new enough for OIDC trusted publishing"
          else
            echo "npm $have is older than 11.5.1 - upgrading"
            npm install -g npm@11
          fi
          npm --version

      - name: Sync optionalDependencies version
        shell: bash
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            for (const k of Object.keys(pkg.optionalDependencies || {})) {
              pkg.optionalDependencies[k] = process.env.VERSION;
            }
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
          "
        env:
          VERSION: ${{ github.ref_name }}

      # `latest` only when every platform the root package promises actually
      # exists at this version. optionalDependencies means a missing platform
      # package does NOT fail `npm install` — it installs clean and then has no
      # binary, so publishing an incomplete release to `latest` produces a
      # silently broken install. `next` makes that breakage opt-in instead.
      #
      # The target list is read from optionalDependencies rather than restated
      # here, so it cannot drift from what the root package actually promises.
      # The check WAITS before it decides, because "not published" and "not
      # visible yet" look identical from here and only one of them is a reason
      # to withhold `latest`. A platform tarball is ~120MB and npm answers the
      # publish with "your package is being processed and may take a few
      # minutes to become available" — so a single probe fired the moment the
      # build job ends reads a package that is on its way as a package that
      # never shipped. That is what put 0.22.3, 0.22.4 and 0.23.0 under `next`
      # while `latest` sat three releases behind on 0.22.2: every one of those
      # releases was complete, and every one of them lost the race.
      #
      # --prefer-online is load-bearing. npm caches registry metadata, so a
      # negative lookup taken on the first pass is replayed for the rest of the
      # loop and the retry proves nothing. Forcing revalidation is what makes
      # the wait a wait rather than a delay.
      #
      # The deadline is real: a genuinely failed platform build must still fall
      # through to `next` rather than hanging the job to its 10-minute timeout,
      # which would withhold the release from every platform that did build.
      - name: Decide dist-tag
        id: disttag
        shell: bash
        run: |
          VERSION="${VERSION#v}"
          PKGS="$(node -e "console.log(Object.keys(require('./package.json').optionalDependencies||{}).join(' '))")"
          DEADLINE=$(( SECONDS + 360 ))
          while :; do
            MISSING=""
            for pkg in ${PKGS}; do
              if ! npm view "${pkg}@${VERSION}" version --prefer-online >/dev/null 2>&1; then
                MISSING="${MISSING} ${pkg}"
              fi
            done
            [ -z "${MISSING}" ] && break
            [ "${SECONDS}" -ge "${DEADLINE}" ] && break
            echo "Not visible on the registry yet, waiting:${MISSING}"
            sleep 20
          done
          if [ -z "${MISSING}" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
            echo "All platform packages present at ${VERSION} — publishing to latest."
          else
            echo "tag=next" >> "$GITHUB_OUTPUT"
            echo "::warning::Missing platform packages at ${VERSION} after waiting 6 minutes:${MISSING} — publishing under 'next', leaving 'latest' untouched. Re-run the failed build job, then promote with: npm dist-tag add project-brain@${VERSION} latest"
          fi
        env:
          VERSION: ${{ github.ref_name }}

      - name: Publish
        shell: bash
        run: |
          VERSION="${VERSION#v}"
          TAG="${{ steps.disttag.outputs.tag }}"
          if npm view "project-brain@${VERSION}" version >/dev/null 2>&1; then
            echo "project-brain@${VERSION} already published, skipping."
          else
            npm publish --access public --tag "${TAG}"
          fi
        env:
          VERSION: ${{ github.ref_name }}
