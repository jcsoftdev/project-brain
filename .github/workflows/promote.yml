name: Promote dist-tag

# Move `latest` onto a version that already shipped.
#
# The release workflow deliberately publishes under `next` when it cannot see
# every platform package at that version, because optionalDependencies means a
# missing platform package installs clean and then has no binary. That guard is
# right, and it leaves a release stranded whenever it fires — including when it
# fires on a race rather than on a real gap, which is what stranded 0.22.3,
# 0.22.4 and 0.23.0 while `latest` sat on 0.22.2.
#
# Promoting is a publish-level operation, so it belongs where the publish
# credential already lives. Doing it from a laptop needs a token with write
# access to the package on someone's machine, which is a worse place for it
# than repository secrets.
#
# This job re-runs the completeness check rather than trusting the operator.
# A one-click way to point `latest` at an incomplete release would defeat the
# guard it exists to recover from.
#
# Authentication is npm trusted publishing (OIDC), not a token: npm demands an interactive
# one-time password for dist-tag changes from a token, but not from a trusted publisher
# that has "Allow npm dist-tag" enabled (it is off by default and separate from publishing).
# One-time setup on npmjs.com, package project-brain, Settings, Trusted publisher: add this
# workflow (promote.yml) for the GitHub repository, and tick "Allow npm dist-tag". After
# that a stranded release is recovered from the Actions tab with no OTP and no laptop.
# release.yml already reaches `latest` by itself when every platform package is visible
# within its 18-minute wait; this workflow is the recovery path for when it was not.

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to promote to latest (e.g. 0.23.0, no leading v)"
        required: true
        type: string
      tag:
        description: "dist-tag to point at that version"
        required: false
        default: latest
        type: choice
        options:
          - latest
          - next

jobs:
  promote:
    name: Promote ${{ inputs.version }} to ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # OIDC for dist-tag changes needs npm >= 11.21.0 (publishing alone needs 11.5.1); assert it rather than discover it as a failure.
      - name: Ensure npm supports OIDC trusted publishing
        shell: bash
        run: |
          have="$(npm --version)"
          if node -e 'const a=process.argv[1].split(".").map(Number),b=[11,21,0];process.exit((a[0]>b[0]||(a[0]===b[0]&&(a[1]>b[1]||(a[1]===b[1]&&a[2]>=b[2]))))?0:1)' "$have"; then
            echo "npm $have is new enough for OIDC trusted publishing"
          else
            echo "npm $have is older than 11.21.0 - upgrading"
            npm install -g npm@11
          fi

      - name: Verify the release is complete
        shell: bash
        run: |
          VERSION="${VERSION#v}"
          if ! npm view "project-brain@${VERSION}" version --prefer-online >/dev/null 2>&1; then
            echo "::error::project-brain@${VERSION} is not published. Nothing to promote."
            exit 1
          fi
          # Read the platform list from the published package rather than from
          # this checkout: promoting an old version must check what THAT
          # version promised, not what main promises today.
          MISSING=""
          for pkg in $(npm view "project-brain@${VERSION}" optionalDependencies --json --prefer-online \
                        | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>console.log(Object.keys(JSON.parse(d||'{}')).join(' ')))"); do
            if ! npm view "${pkg}@${VERSION}" version --prefer-online >/dev/null 2>&1; then
              MISSING="${MISSING} ${pkg}"
            fi
          done
          if [ -n "${MISSING}" ]; then
            echo "::error::Refusing to promote ${VERSION} — platform packages missing:${MISSING}. Re-run the failed build job in the release run for this tag first."
            exit 1
          fi
          echo "All platform packages present at ${VERSION}."
        env:
          VERSION: ${{ inputs.version }}

      - name: Promote
        shell: bash
        run: |
          VERSION="${VERSION#v}"
          CURRENT="$(npm view project-brain "dist-tags.${TAG}" --prefer-online 2>/dev/null || echo none)"
          if [ "${CURRENT}" = "${VERSION}" ]; then
            echo "${TAG} already points at ${VERSION}, nothing to do."
            exit 0
          fi
          npm dist-tag add "project-brain@${VERSION}" "${TAG}"
          echo "${TAG}: ${CURRENT} -> ${VERSION}"
        env:
          VERSION: ${{ inputs.version }}
          TAG: ${{ inputs.tag }}
